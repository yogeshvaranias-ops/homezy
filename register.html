<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - HomeRent</title>

<link rel="stylesheet" href="register.css">

</head>


<body>


<div class="register-container">


<div class="register-card">


<div class="logo">
🏠 Homezy
</div>


<h2>
Create Account
</h2>


<p>
Join Homezy today
</p>



<input 
type="text"
id="name"
placeholder="Full Name">



<input 
type="email"
id="email"
placeholder="Email">



<input 
type="password"
id="password"
placeholder="Password">





<button onclick="registerUser()">

Create Account

</button>





<p>

Already have account?

<a href="login.html">
Login
</a>


</p>



</div>


</div>




<script src="register.js"></script>


</body>

</html>
