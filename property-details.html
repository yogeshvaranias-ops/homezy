<!DOCTYPE html>

<body>

<header>

<div class="logo">
🏠 Homezy
</div>


<a href="properties.html">
← Back
</a>


</header>




<section class="details-container">

<img id="propertyImage">

</div>





<div class="details-box">


<h1 id="propertyName">

</h1>


<p id="propertyLocation">

</p>


<p id="propertyType">

</p>

</h2>

<h2>
👤 Owner Details
</h2>

<p id="ownerPhone"></p>


</div>



<div class="map-box">

<h2>
📍 Location Map
</h2>


<iframe 
id="mapFrame"
width="100%"
height="300"
style="border:0;"
loading="lazy">
</iframe>

</button>



</div>


</section>





<script src="details.js"></script>
